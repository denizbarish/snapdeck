<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Snapdeck promotional tile</title>
    <!--
      The Chrome Web Store's small promotional tile, 440x280.

      Full bleed: the store asks for artwork with no padding and no white
      border, so the page is exactly the tile and the tile is exactly the
      colour. `#1c1c1e` is the editor's own chrome and the type stack is the one
      `Editor.tsx` sets on it, so the tile is in the same two materials as the
      product rather than in a third one invented for a store.

      The ground is dark rather than the accent blue, and that is the icon's
      doing: the mark is a blue selection inside a dark square, so on a blue
      tile the selection is the tile and only the handles survive. On this
      ground the blue is the one saturated thing in the frame.

      Nothing here draws an interface. The icon is the extension's own file and
      the sentence is the description in its own `manifest.json`; a tile that
      mocked up a screen would be a drawing of the software, and the listing has
      real screenshots for that.
    -->
    <style>
      html, body {
        margin: 0;
        width: 440px;
        height: 280px;
        overflow: hidden;
      }

      .tile {
        box-sizing: border-box;
        width: 440px;
        height: 280px;
        padding: 0 40px;
        background: #1c1c1e;
        color: #ffffff;
        font-family: system-ui, -apple-system, 'Helvetica Neue', sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      /*
        Drawn at 76 points from a 128-pixel file, so the icon is never enlarged
        past its own resolution. The mark's own square is a shade lighter than
        this ground, which is what keeps it a mark on a tile rather than a hole
        in it.
      */
      .icon {
        width: 76px;
        height: 76px;
        display: block;
      }

      h1 {
        margin: 18px 0 8px;
        font-size: 40px;
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1;
      }

      p {
        margin: 0;
        max-width: 300px;
        font-size: 16px;
        line-height: 1.4;
        /* Held back from the heading rather than greyed: white at full strength
           twice over gives the name and the sentence the same weight. */
        color: rgba(255, 255, 255, 0.86);
      }
    </style>
  </head>
  <body>
    <div class="tile">
      <img class="icon" id="icon" alt="" />
      <h1>Snapdeck</h1>
      <!-- Verbatim from `apps/extension/public/manifest.json`, which is also
           the store's own short description. -->
      <p>Capture a whole web page and hand it to the Snapdeck app.</p>
    </div>
    <script type="module" src="/src/promo.ts"></script>
  </body>
</html>
