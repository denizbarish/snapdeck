<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Snapdeck Overlay</title>
    <!-- `apps/desktop/overlay.html`, minus the transparent background: that
         window is composited over a frozen screen and this page is not, so a
         transparent body here would photograph as white. -->
    <style>
      html, body, #overlay-root { margin: 0; height: 100%; width: 100%; overflow: hidden; }
      body { background: #000; cursor: crosshair; user-select: none; }
    </style>
  </head>
  <body>
    <div id="overlay-root"></div>
    <script type="module" src="/src/overlay.tsx"></script>
  </body>
</html>
