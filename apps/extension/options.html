<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Snapdeck Options</title>
    <style>
      /*
       * One column, one field, two buttons and a line that answers. The page is
       * static markup because it is static: nothing here appears or disappears,
       * so there is nothing for a framework to keep in step, and a framework
       * would be this extension's only runtime dependency.
       *
       * Grouping is done with space rather than rules, and the one rule on the
       * page separates the explanation from the thing being explained.
       */
      :root {
        color-scheme: light dark;
        --page: #f6f6f7;
        --surface: #ffffff;
        --text: #1c1c1e;
        --muted: #63636b;
        --border: #d8d8de;
        --field-border: #b9b9c1;
        --accent: #1f5ad6;
        --good: #1a7f37;
        --bad: #b3261e;
        --button-face: #1c1c1e;
        --button-text: #ffffff;

        /* One step of subordination, used everywhere something is inside
           something else. */
        --step: 8px;
        --radius: 8px;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --page: #161619;
          --surface: #1f1f23;
          --text: #f2f2f5;
          --muted: #a2a2ab;
          --border: #2f2f36;
          --field-border: #45454f;
          --accent: #7aa7ff;
          --good: #4ac26b;
          --bad: #ff8a80;
          --button-face: #f2f2f5;
          --button-text: #17171a;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: calc(var(--step) * 5) calc(var(--step) * 3);
        background: var(--page);
        color: var(--text);
        font: 15px/1.55 system-ui, -apple-system, 'Segoe UI', sans-serif;
      }

      main {
        max-width: 34rem;
        margin-inline: auto;
      }

      h1 {
        margin: 0 0 calc(var(--step) * 1.5);
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .lede {
        margin: 0 0 calc(var(--step) * 4);
        color: var(--muted);
      }

      .card {
        padding: calc(var(--step) * 3);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: calc(var(--radius) * 1.5);
      }

      h2 {
        margin: 0 0 var(--step);
        font-size: 15px;
        font-weight: 600;
      }

      .hint {
        margin: 0 0 calc(var(--step) * 2);
        color: var(--muted);
        font-size: 13px;
      }

      label {
        display: block;
        margin-bottom: var(--step);
        font-weight: 500;
      }

      input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--field-border);
        border-radius: var(--radius);
        background: var(--surface);
        color: inherit;
        font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        /* A token is 64 characters with no words in it; wrapping it would make
           a missing character impossible to see. */
        text-overflow: ellipsis;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: calc(var(--step) * 1.5);
        margin-top: calc(var(--step) * 2.5);
      }

      button {
        padding: 9px 16px;
        border-radius: var(--radius);
        border: 1px solid var(--field-border);
        background: transparent;
        color: inherit;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }

      button[type='submit'] {
        border-color: transparent;
        background: var(--button-face);
        color: var(--button-text);
      }

      button:disabled {
        opacity: 0.5;
        cursor: default;
      }

      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      #status {
        /* Reserved whether or not there is anything to say, so the buttons do
           not move under the pointer the moment one is pressed. */
        min-height: calc(var(--step) * 3);
        margin: calc(var(--step) * 2.5) 0 0;
        font-size: 13px;
        color: var(--muted);
      }

      #status[data-tone='good'] {
        color: var(--good);
      }

      #status[data-tone='bad'] {
        color: var(--bad);
      }
    </style>
  </head>
  <body>
    <main id="options">
      <h1>Snapdeck</h1>
      <p class="lede">
        This extension captures a whole page and hands it to the Snapdeck app on this Mac. The two
        are paired by a token, so nothing else running here can send the app a picture.
      </p>

      <form class="card" id="pairing">
        <h2>Pairing token</h2>
        <p class="hint" id="token-hint">
          In Snapdeck, open Settings, then Browser Extension, and copy the token. It never leaves
          this machine.
        </p>

        <label for="token">Token</label>
        <input
          id="token"
          name="token"
          type="text"
          spellcheck="false"
          autocomplete="off"
          autocapitalize="off"
          aria-describedby="token-hint"
          placeholder="64 characters, 0-9 and a-f"
        />

        <div class="actions">
          <button type="submit" id="save">Save</button>
          <button type="button" id="test">Test connection</button>
        </div>

        <p id="status" role="status" aria-live="polite"></p>
      </form>
    </main>
    <script type="module" src="/src/options/main.ts"></script>
  </body>
</html>
