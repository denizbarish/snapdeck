<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Snapdeck Settings</title>
    <style>
      /*
        The window's own background, and the one place its value is written.
        This window is built visible, so the first frame is painted before React
        has mounted; without a background here the user sees a white rectangle
        flash where a grey settings sheet is about to be. The component needs
        the same colour for the page and the sticky footer, and reads it from
        this property rather than repeating it: two copies of a colour is how
        the flash comes back, showing the old colour for one frame.
      */
      :root { --settings-background: #f5f5f7; }
      html, body, #settings-root { margin: 0; min-height: 100%; }
      body { background: var(--settings-background); }
    </style>
  </head>
  <body>
    <div id="settings-root"></div>
    <script type="module" src="/src/settings/main.tsx"></script>
  </body>
</html>
