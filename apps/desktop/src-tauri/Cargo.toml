[package]
name = "snapdeck"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "snapdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# `build.rs` reads the editor package's `chrome.json`, which is the single
# source of the toolbar's minimum width. Already in the tree as a transitive
# dependency of `tauri-build`.
serde_json = "1"

[dependencies]
tauri = { version = "2.11.5", features = ["macos-private-api", "protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-clipboard-manager = "2.3.3"
# The save folder is chosen in a real macOS folder picker rather than typed, and
# the picker is driven from Rust so the settings webview needs no dialog
# permission of its own.
tauri-plugin-dialog = "2.7.3"
# `launch_at_login` is applied rather than stored. The macOS default here is the
# launch agent, not the AppleScript login item: the AppleScript path drives
# System Events, which costs the user an Automation prompt for a checkbox.
tauri-plugin-autostart = "2.5.1"
snapdeck-capture = { path = "../../../crates/capture" }
serde.workspace = true
# The settings file. Already in the tree as a build dependency, which reads the
# editor's `chrome.json`, and as a transitive dependency of `tauri`.
serde_json = "1"
# `jpeg` on top of the workspace's `png`, because the capture's format is now a
# setting. Added here rather than in the workspace, so the capture crate is not
# made to carry an encoder it never calls.
image = { workspace = true, features = ["jpeg"] }
# Filenames carry the local wall clock, and the time zone database behind it is
# the one thing `std` has no answer for. Only `clock` is enabled: no parsing, no
# formatting, no serde, no `oldtime`.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# The frozen frame's absolute path travels in the overlay URL's query string.
percent-encoding = "2"
# Updates from GitHub Releases, over a signed manifest. `default-features` is
# left on for `rustls-tls` and `system-proxy`; `zip` comes with them and is the
# only part this build cannot use, since a macOS update arrives as a `.tar.gz`
# and the feature is Windows-only in the plugin's own `cfg`.
tauri-plugin-updater = "2.11.0"
# The pairing token is 32 bytes straight from the system CSPRNG. One function
# (`fill`); a seeded userspace generator would add nothing to a one-off secret,
# and 0.4.3 is already in `Cargo.lock`.
getrandom = "0.4"
# `BridgeError`, in the shape of `crates/frame/src/error.rs`.
thiserror.workspace = true
# `semver::Version` is the type the updater's version comparator is written
# against, and the plugin does not re-export it. The comparison rule is
# `updater::is_upgrade`, which is the one place this application decides what
# counts as an update.
semver = "1"
# The bridge's WebSocket server. Tauri's ecosystem has no server-side one:
# `tauri-plugin-websocket` is a client and `tauri-plugin-localhost` serves the
# application's own page. `accept_hdr_with_config` hands over the handshake
# headers, which is where `Origin` is read, and `WebSocketConfig` carries the
# size limit; those are exactly the two hooks the gates need. The synchronous
# build is the one taken: the bridge sees a handful of connections in its life,
# a thread per session is simpler than an async task, and no `tokio` comes with
# it. Default features carry no TLS, and the crate's MSRV is the workspace's.
tungstenite = "0.30"

[target.'cfg(target_os = "macos")'.dependencies]
# The overlay window has to be lifted above the menu bar and allowed over a
# full-screen Space, neither of which Tauri's window builder exposes.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSWindow"] }
# `MainThreadMarker`, which is what makes touching a main-thread-only `NSWindow`
# from a raw pointer checked rather than assumed.
objc2 = { version = "0.6", default-features = false, features = ["std"] }

[dev-dependencies]
# The refusal itself, tested rather than assumed. `tauri-plugin-updater` keeps
# its `verify_signature` private, so the test calls what that function calls:
# both crates are already in the tree as dependencies of the plugin, and the
# versions here are the ones it already resolves to.
minisign-verify = "0.2"
base64 = "0.22"
