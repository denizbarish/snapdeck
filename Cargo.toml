[workspace]
resolver = "2"
members = ["apps/desktop/src-tauri", "crates/capture"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/denizbarish/snapdeck"

[workspace.dependencies]
# `macos_14_0` gates the whole `screenshot_manager` module, which holds
# `SCScreenshotManager` and `CGImageExt::rgba_data`. No higher feature is
# enabled: region capture uses `SCStreamConfiguration::with_source_rect`,
# which is not version gated.
screencapturekit = { version = "9.0.1", features = ["macos_14_0"] }
core-graphics = "0.25"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
