name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to check the manifests against, e.g. v0.1.0. Nothing is published: the run builds the bundles and uploads them as workflow artifacts."
        required: true
        type: string

# Read-only by default, so the version job below gets nothing it does not need.
# Only the build job, which writes the draft release and its assets, is granted
# `contents: write`.
permissions:
  contents: read

# Two runs for the same tag would race each other over the same draft release.
# Queue the second one rather than cancelling the first: a cancelled run can
# have uploaded half of the assets already.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # A tag says which version this is. `tauri.conf.json` says which version the
  # app reports and names its bundles after. `Cargo.toml` says which version the
  # binary is built as. A release where those three disagree ships a DMG that is
  # not what its tag claims, and nobody finds out until something refuses to
  # line up with its own name. So they are compared first, on a cheap runner,
  # and the build below never starts unless they agree.
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        env:
          # Empty for a tag push, where the tag is the ref being built.
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          tag="${DISPATCH_TAG:-$GITHUB_REF_NAME}"
          version="${tag#v}"

          conf_version="$(jq -er '.version' apps/desktop/src-tauri/tauri.conf.json)"

          # `[workspace.package] version`, which every crate in the workspace
          # inherits.
          cargo_version="$(
            awk '
              /^\[workspace\.package\]/ { in_section = 1; next }
              /^\[/                     { in_section = 0 }
              in_section && /^version[[:space:]]*=/ {
                gsub(/[",]/, "", $3); print $3; exit
              }
            ' Cargo.toml
          )"

          echo "tag              $tag -> $version"
          echo "tauri.conf.json  $conf_version"
          echo "Cargo.toml       $cargo_version"

          failed=0

          if [ -z "$version" ] || [ "$version" = "$tag" ]; then
            echo "::error::'$tag' is not a version tag: it has to look like v0.1.0"
            failed=1
          fi

          if [ "$conf_version" != "$version" ]; then
            echo "::error::apps/desktop/src-tauri/tauri.conf.json says $conf_version, the tag says $version"
            failed=1
          fi

          if [ "$cargo_version" != "$version" ]; then
            echo "::error::Cargo.toml [workspace.package] says $cargo_version, the tag says $version"
            failed=1
          fi

          # The app crate carries no version of its own, so the workspace
          # version above is the version the binary is built as. If that ever
          # stops being true, this check is reading the wrong file and has to
          # say so rather than keep passing.
          if ! grep -qx 'version.workspace = true' apps/desktop/src-tauri/Cargo.toml; then
            echo "::error::apps/desktop/src-tauri/Cargo.toml no longer inherits [workspace.package] version"
            failed=1
          fi

          [ "$failed" -eq 0 ] || exit 1

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: version
    # macos-latest, not a pinned older image, for the reason CI's `rust` job
    # gives: screencapturekit's apple-metal dependency builds a Swift bridge
    # that needs a Metal SDK macos-14 does not ship. The app's own runtime
    # baseline is still macOS 14.0, set in `tauri.conf.json`.
    runs-on: macos-latest
    # The draft release and its assets are written with the job's own token.
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
      # Signing and notarization are one unit here: a Developer ID build that is
      # not notarized is still stopped by Gatekeeper, and Tauri fails outright
      # when handed only part of the notarization credentials. So all six or
      # none, and none is a supported outcome.
      SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
      # The updater's signing key, which is a different key from the Apple one
      # above and answers a different question: not who built the app, but
      # whether an archive an installed copy just downloaded is the one this
      # workflow produced. The private half exists only as this secret. Its
      # public half is in `tauri.conf.json` and ships inside every build, which
      # is what makes the check work on a machine that has never seen this
      # repository.
      #
      # Both or neither. The key this project uses carries a password, and a
      # signing step that runs without it fails in the middle of a release
      # rather than before it.
      UPDATER: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # No `version:` input: it must not disagree with packageManager in
      # package.json, and the action reads that field on its own.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install the frontend dependencies
        # The root `prepare` script downloads the Chromium the editor's tests
        # are driven in. This job builds the app and never runs them, and that
        # download is 150 MB of nothing on every release.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile

      # Runs only when every Developer ID secret is set. When they are not, the
      # variables stay absent and the ad-hoc step below takes over rather than
      # the build failing: Tauri reads these with `var_os`, which cannot tell an
      # empty variable from an unset one, so passing them through
      # unconditionally would break every unsigned build.
      - name: Provide the Apple Developer ID credentials
        if: env.SIGNING == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            # The delimited form, because a pasted certificate is allowed to
            # carry newlines.
            {
              printf '%s<<SNAPDECK_SECRET_EOF\n' "$name"
              printf '%s\n' "${!name}"
              printf 'SNAPDECK_SECRET_EOF\n'
            } >> "$GITHUB_ENV"
          done

      # The other half of the same decision, for when there is no Developer ID.
      # `-` is codesign's ad-hoc identity: it needs no Apple account, and it
      # proves nothing about who built the app. What it does is seal the bundle,
      # and a sealed bundle is what Gatekeeper needs before it can reach a
      # verdict at all. Without it the bundle has no `Contents/_CodeSignature`,
      # only the linker's signature on the executable, `codesign --verify` fails
      # on the `.app`, and macOS refuses a downloaded copy as *damaged* rather
      # than as coming from an unidentified developer, which sends people to the
      # Trash instead of to Open Anyway.
      #
      # Set here rather than in `tauri.conf.json` so a local `pnpm tauri build`
      # is unchanged, and through `$GITHUB_ENV` rather than the build step's own
      # `env:`, which would override the real identity when the secrets exist.
      # Tauri signs the `.app` and only then builds the DMG around it, so the
      # published DMG carries the sealed bundle.
      - name: Sign the app bundle ad-hoc
        if: env.SIGNING != 'true'
        run: echo 'APPLE_SIGNING_IDENTITY=-' >> "$GITHUB_ENV"

      - name: Build the app
        run: pnpm tauri build

      - name: Collect the bundles
        id: bundles
        run: |
          set -euo pipefail
          shopt -s nullglob

          bundle=target/release/bundle
          app="$bundle/macos/Snapdeck.app"
          [ -d "$app" ] || { echo "::error::no app bundle at $app"; exit 1; }

          # The seal, checked on the bundle that is about to be packaged rather
          # than assumed from the step that was supposed to produce it. This
          # holds for both signing paths and is a hard failure in both: an
          # unsealed bundle is one macOS calls damaged, and shipping a DMG full
          # of that is worse than not shipping.
          codesign --verify --deep --strict --verbose=2 "$app"

          # What Gatekeeper makes of it. Recorded, not asserted: an ad-hoc build
          # is rejected here on purpose, and a notarized one would pass, so
          # neither outcome is an error for this workflow.
          spctl --assess --type execute --verbose=4 "$app" || true

          dmgs=("$bundle"/dmg/*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ]; then
            echo "::error::expected exactly one DMG in $bundle/dmg, found ${#dmgs[@]}"
            exit 1
          fi
          dmg="${dmgs[0]}"

          # `Snapdeck_0.1.0_aarch64`, which already carries the architecture the
          # runner built for, so the tarball beside it is named the same way
          # without this workflow having to know what that architecture was.
          base="$(basename "$dmg" .dmg)"

          mkdir -p dist
          cp "$dmg" "dist/$base.dmg"
          # macOS `tar` writes an AppleDouble `._` file beside every entry with
          # extended attributes unless this is set, and an app bundle has them.
          COPYFILE_DISABLE=1 tar -czf "dist/$base.app.tar.gz" -C "$bundle/macos" Snapdeck.app

          ( cd dist && shasum -a 256 "$base.dmg" "$base.app.tar.gz" > SHA256SUMS.txt )

          # What Gatekeeper will see, read off the bundle rather than inferred
          # from which secrets happened to be set. The ad-hoc signature above
          # seals the bundle but carries no authority, so only a Developer ID
          # authority line counts as signed here.
          if codesign --display --verbose=2 "$app" 2>&1 | grep -q '^Authority=Developer ID Application'; then
            signed=true
          else
            signed=false
          fi
          echo "signed: $signed"

          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "signed=$signed" >> "$GITHUB_OUTPUT"

      - name: Write the release notes
        id: notes
        env:
          BASE: ${{ steps.bundles.outputs.base }}
          SIGNED: ${{ steps.bundles.outputs.signed }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/notes.md"

          {
            echo "Snapdeck $VERSION for macOS 14 or later, on Apple silicon."
            echo
            echo "## Install"
            echo
            echo "1. Download \`$BASE.dmg\`, open it and drag **Snapdeck** into Applications."
            if [ "$SIGNED" = true ]; then
              echo "2. Open Snapdeck from Applications. This build is signed with an Apple Developer ID and notarized, so macOS opens it without a warning."
            else
              echo "2. **This build is not signed with an Apple Developer ID**, so macOS will not open it on a double-click. Control-click (or right-click) Snapdeck in Applications, choose **Open**, and confirm. On macOS 15 and later that dialog offers no way through: dismiss it, then open System Settings > Privacy & Security, where a message about Snapdeck now has an **Open Anyway** button. It is once per install either way; macOS remembers."
            fi
            echo "3. Snapdeck is a menu bar app: it has no Dock icon and opens no window on launch."
            echo "4. The first capture asks for Screen Recording permission. Grant it in System Settings > Privacy & Security > Screen & System Audio Recording, then **quit Snapdeck and open it again**. macOS decides what a process may capture when the process starts, so a running Snapdeck cannot see a permission granted after launch."
            echo
            echo "## Signing"
            echo
            if [ "$SIGNED" = true ]; then
              echo "Signed with an Apple Developer ID certificate and notarized by Apple."
            else
              echo "Not signed with an Apple Developer ID and not notarized: there is no Apple Developer account for this project. The bundle is signed ad-hoc instead, which seals its contents so macOS can verify nothing was altered after the build and can name Snapdeck as coming from an unidentified developer rather than refusing it as damaged. An ad-hoc signature attributes the app to nobody, which is why the first launch needs the step above. Check the download against \`SHA256SUMS.txt\` if you want more than that."
            fi
            echo
            echo "## Checksums"
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } > "$notes"

          echo "path=$notes" >> "$GITHUB_OUTPUT"
          cat "$notes" >> "$GITHUB_STEP_SUMMARY"

      # The manifest `Check for Updates…` reads, written here and nowhere else.
      #
      # A hand-written manifest is a promise about a file somebody else built.
      # This one is generated from the archive that is being published in the
      # same run: the signature is taken over those exact bytes, the URL names
      # the asset this job is about to upload, and the version is the one the
      # first job already proved the tag, `tauri.conf.json` and `Cargo.toml`
      # agree on. There is no step at which the manifest and the release can
      # come to describe different builds.
      #
      # The `.sig` the signer leaves behind is deleted rather than published.
      # The manifest carries the same signature inline, and two copies of one
      # signature is one more thing that can disagree.
      - name: Sign the update archive and write the manifest
        if: env.UPDATER == 'true'
        env:
          # Read by the Tauri CLI. Given to this step alone, so they are not in
          # the environment of anything that runs after it.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          BASE: ${{ steps.bundles.outputs.base }}
          NOTES: ${{ steps.notes.outputs.path }}
        run: |
          set -euo pipefail

          # Absolute, because `pnpm tauri` runs the CLI with `apps/desktop` as
          # its working directory and a relative path would land there.
          archive="$PWD/dist/$BASE.app.tar.gz"
          pnpm tauri signer sign "$archive"
          signature="$(cat "$archive.sig")"
          rm "$archive.sig"

          # The updater looks the platform up by `{os}-{arch}`, and the DMG's
          # own name carries the architecture Tauri built for. Mapped rather
          # than passed through: the two vocabularies agree on `aarch64` and
          # disagree on Intel, where the bundle says `x64` and the updater says
          # `x86_64`. An architecture neither of them names is a runner change,
          # and it fails here instead of publishing a manifest no installed copy
          # can match itself against.
          arch="${BASE##*_}"
          case "$arch" in
            aarch64) platform="darwin-aarch64" ;;
            x64) platform="darwin-x86_64" ;;
            *)
              echo "::error::unknown architecture '$arch' in bundle name '$BASE'"
              exit 1
              ;;
          esac

          # What the update dialog shows, which is the release notes minus the
          # two sections that only make sense for a manual download: the install
          # steps, which the updater performs itself, and the checksums, which
          # it verifies with the signature instead.
          notes="$(
            awk '
              BEGIN { keep = 1 }
              /^## / { keep = ($0 != "## Install" && $0 != "## Checksums") }
              keep
            ' "$NOTES"
          )"

          jq -n \
            --arg version "$VERSION" \
            --arg notes "$notes" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg platform "$platform" \
            --arg signature "$signature" \
            --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG/$BASE.app.tar.gz" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: { ($platform): { signature: $signature, url: $url } }
            }' > dist/latest.json

          echo "manifest for $platform:"
          jq '.platforms[].signature = "<signature>"' dist/latest.json

      # Said out loud rather than left to be discovered. A release with no
      # manifest is a release nobody can update to: every installed copy asks
      # `releases/latest/download/latest.json`, gets a 404, and reports that it
      # could not check.
      - name: Warn that this release cannot be updated to
        if: env.UPDATER != 'true'
        run: |
          echo "::warning::TAURI_SIGNING_PRIVATE_KEY or TAURI_SIGNING_PRIVATE_KEY_PASSWORD is not set, so no latest.json was written and no installed copy can update to this release."

      # Uploaded on every run, including the manual ones that publish nothing:
      # this is what makes the workflow provable without cutting a release.
      - uses: actions/upload-artifact@v4
        with:
          name: snapdeck-${{ needs.version.outputs.version }}-macos
          path: dist
          if-no-files-found: error

      # Only a tag push publishes, and it publishes a draft: a human decides
      # when the release goes public.
      - name: Open the draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ steps.notes.outputs.path }}
        run: |
          set -euo pipefail

          # A version with a pre-release part, `v0.2.0-rc.1`, is marked as one.
          # Two things point at GitHub's idea of "latest" and neither of them
          # should ever reach a release candidate: the README's install link,
          # and the updater endpoint every installed copy asks. Without this
          # flag, publishing an `-rc` draft would hand it to all of them. Set
          # explicitly either way, so that re-running a build cannot leave the
          # flag from a previous tag on the release.
          case "$VERSION" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          echo "prerelease: $prerelease"

          if gh release view "$TAG" >/dev/null 2>&1; then
            # No --draft here: re-running the build must not un-publish a
            # release a human has already decided to publish.
            gh release edit "$TAG" --title "Snapdeck $VERSION" --notes-file "$NOTES" \
              --prerelease="$prerelease"
          else
            gh release create "$TAG" --draft --prerelease="$prerelease" \
              --title "Snapdeck $VERSION" --notes-file "$NOTES"
          fi
          gh release upload "$TAG" dist/* --clobber
