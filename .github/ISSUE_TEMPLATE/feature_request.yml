name: Feature request
description: Something Snapdeck should be able to do.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task, not the feature. What you were doing when Snapdeck got in the way is the most useful thing here.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What should it do instead?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you do today
      description: The workaround, another app, or nothing.
    validations:
      required: false
