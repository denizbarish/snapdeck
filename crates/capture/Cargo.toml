[package]
name = "snapdeck-capture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Cross-platform screen capture abstraction for Snapdeck"

[dependencies]
serde.workspace = true
snapdeck-frame = { path = "../frame" }
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit.workspace = true
core-graphics.workspace = true

[dev-dependencies]
# Only the tests read a `CaptureError` back as the JSON the Tauri bridge puts
# on the wire. Already in the lock file through the desktop application, so
# this edge costs the tree nothing.
serde_json = "1"
